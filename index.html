<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dynamic Security Shield</title>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: sans-serif;
        }
        #nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 45px;
            background-color: #222222;
            display: flex;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
            z-index: 20;
        }
        #url-input {
            flex: 1;
            height: 30px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #333;
            color: #fff;
            padding: 0 10px;
            font-size: 14px;
        }
        #go-btn {
            height: 32px;
            margin-left: 10px;
            padding: 0 15px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        #content-area {
            position: fixed;
            top: 45px;
            left: 0;
            width: 100vw;
            height: calc(100vh - 45px);
            z-index: 10;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }
        #shield-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 99999;
            display: none;
        }
        #video-container {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 60px;
            height: 45px;
            border-radius: 4px;
            overflow: hidden;
            opacity: 0.15;
            z-index: 100;
            pointer-events: none;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
    </style>
</head>
<body>

    <div id="nav-bar">
        <input type="text" id="url-input" placeholder="Dán hoặc nhập link trang web tại đây (Ví dụ: https://truyenchu.vn)...">
        <button id="go-btn" onclick="changeLink()">Duyệt</button>
    </div>

    <div id="shield-overlay"></div>

    <div id="content-area">
        <iframe id="web-frame" src="https://truyenchu.vn"></iframe>
    </div>

    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const overlay = document.getElementById('shield-overlay');
        const webFrame = document.getElementById('web-frame');
        const urlInput = document.getElementById('url-input');

        function changeLink() {
            let url = urlInput.value.trim();
            if (url) {
                if (!/^https?:\/\//i.test(url)) {
                    url = 'https://' + url;
                }
                webFrame.src = url;
            }
        }

        urlInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                changeLink();
                urlInput.blur();
            }
        });

        const faceDetection = new FaceDetection({
            locateFile: (file) => `https://jsdelivr.net{file}`
        });

        faceDetection.setOptions({
            modelSelection: 0,
            minDetectionConfidence: 0.6
        });

        faceDetection.onResults((results) => {
            let faces = results.detections ? results.detections.length : 0;
            if (faces >= 2) {
                overlay.style.display = 'block';
            } else {
                overlay.style.display = 'none';
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceDetection.send({ image: videoElement });
            },
            width: 320,
            height: 240
        });
        camera.start().catch(err => console.error(err));
    </script>
</body>
</html>
